<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrowseCraft</title>
    <meta name="description" content="BrowseCraft is a Minecraft Server browsing utility featuring player lists showing skin faces.">
    <meta name="keywords" content="Minecraft, Server, Browser, Player List">
    <meta name="author" content="Lonnie Smith">

    <!-- Styles & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/variables.css">

    <!-- Scripts -->
    <script type="module" src="scripts/services.mjs" defer></script>
    <script type="module" src="scripts/utils.mjs" defer></script>
</head>
<body>
    <header>
        <section class="header">
            <img id="logo" src="data/images/logo.png" alt="BrowseCraft Logo" class="logo" width="64" height="64">
            <h1>BrowseCraft</h1>
            <img id="clouds" src="data/images/clouds.png" alt="Clouds" class="clouds" width="128" height="64">
        </section>
        <section class="grass">
        </section>
    </header>
    <main>
        <section class="user-actions">
            <!-- Search bar and filter & surprise buttons will be generated here -->
        </section>
        <section class="server-list">
            <!-- Server cards will be generated here -->
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Lonnie Smith. All rights reserved. <br>  All credit for Minecraft textures goes to Mojang Studios. Screenshots of game textures are only used for illustrative purposes.</p>
    </footer>
</body>
</html>
